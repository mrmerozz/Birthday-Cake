<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <p class="bg-text" id="bgText">Happy Birthday</p>

  <div class="wrap">

    <div class="form-area" id="formArea">
      <p class="label">Who's celebrating?</p>
      <div class="input-group">
        <input type="text" id="nameInput" placeholder="Your name" maxlength="20" autocomplete="off">
        <input type="number" id="ageInput" min="1" max="40" placeholder="Age">
      </div>
      <p class="warning" id="warning"></p>
      <button id="celebrateBtn">Celebrate</button>
    </div>

    <div class="cake-area" id="cakeArea">
      <div class="candles" id="candles"></div>
      <div class="cake" id="cake">
        <div class="cake-top"></div>
        <div class="cake-body">
          <div class="cake-drips" id="cakeDrips"></div>
        </div>
        <div class="cake-shadow"></div>
      </div>
      <div class="plate"></div>
      <p class="blow-hint" id="blowHint">Click the cake to blow out the candles</p>
    </div>

    <p class="message" id="message"></p>

  </div>

  <script src="assets/js/themes.js"></script>
  <script src="assets/js/cake.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
