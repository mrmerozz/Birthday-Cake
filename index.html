<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Cake</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="background-text" class="background-text">🎂 Happy Birthday 🎉</div>

    <div class="controls" id="controls">
        <input type="number" id="age-input" placeholder="Age?" min="1" max="80">
        <button id="celebrate-btn">Celebrate!!</button>
    </div>

    <div id="cake-container" class="cake-container">
        <div class="cake-layers-wrapper">
            <div class="cake-plate"></div>
            
            <div class="single-cake-layer"></div>
            
            <div id="candles-container" class="candles-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
